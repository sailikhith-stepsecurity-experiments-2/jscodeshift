name: test

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      secure-registry:
        description: 'Harden-Runner secure-registry input'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Harden-Runner
        uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12.1-binding-summary
        with:
          egress-policy: audit
          secure-registry: ${{ inputs.secure-registry || 'false' }}
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Run test
        run: yarn test
